name: uah dev deployment

on:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-west-2
    strategy:
      matrix:
        python: [3.9]
    steps:
      - uses: actions/checkout@v2
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Tox
        run: pip install tox
      - name: Run Tox test environment
        # Run tox using the version of Python in `PATH`
        run: tox -e py
  dev-deployment:
    strategy:
      matrix:
        python: [3.9]
    runs-on: ubuntu-latest
    needs: [unit-tests]
    environment:
      name: dev
    env:
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install tox
        run: pip install tox

      - name: Configure awscli
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Convert secrets and vars to environment variables
        shell: python
        run: |
          import os

          secrets_and_vars = {
              **${{ toJson(secrets) }},
              **${{ toJson(vars) }},
          }

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              for name, value in secrets_and_vars.items():
                  # If the value contains a newline, use the delimiter syntax
                  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#multiline-strings
                  if "\n" in value:
                      print(f"{name}<<EOF\n{value}\nEOF", file=env_file)
                  else:
                      # Standard format for single lines
                      print(f"{name}={value}", file=env_file)

      - name: Deploy with tox
        run: tox -e dev -r -- deploy --require-approval never

      - name: Run DB setup
        env:
          HLS_STACKNAME: ${{ secrets.HLS_STACKNAME }}
        run: |
          setupdb=$(aws cloudformation describe-stacks --stack-name \
          $HLS_STACKNAME --query \
          "Stacks[0].Outputs[?OutputKey=='setupdbexport'].OutputValue" \
          --output=text)
          aws lambda invoke --function-name=$setupdb response.json
